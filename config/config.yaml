# =============================================================================
# Media Deduplication Server Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server.name: Media Deduplication Server
server.processName: media_dedup_server
server.host: localhost
server.port: 8080
server.mode: FAST

# Server Instance Check
server.instanceCheck.enabled: true
server.instanceCheck.bufferSize: 128

# -----------------------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------------------
database.path: data/dedup_server.db

# Database Session Management
database.session.acquireTimeoutMs: 3000
database.session.acquireBackoffMs: 50

# SQLite Memory Optimization
database.sqlite.cacheSize: 1000  # Reduce cache from 2000 to 1000 pages (8MB → 4MB)
database.sqlite.tempStore: memory  # Keep temp tables in memory (faster but uses more RAM)

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level: info

# -----------------------------------------------------------------------------
# Scheduler Configuration
# -----------------------------------------------------------------------------
# Scheduler Jitter
scheduler.jitter.enabled: false
scheduler.jitter.percent: 0

# Scheduler Drift
scheduler.drift.mode: anchored
scheduler.drift.maxDriftMs: 60000

# Scheduler Backoff
scheduler.backoff.enabled: true
scheduler.backoff.initialMs: 1000
scheduler.backoff.multiplier: 2
scheduler.backoff.maxMs: 30000
scheduler.backoff.jitterPercent: 10

# Scheduler Failure Handling
scheduler.maxConsecutiveFailures: 5

# Per-job failure limits (override global setting)
scheduler.jobs:
  fileScan:
    maxConsecutiveFailures: 3
  mediaProcessor:
    maxConsecutiveFailures: 10

# -----------------------------------------------------------------------------
# Memory Optimization Settings
# -----------------------------------------------------------------------------
# FilesManager Memory Optimization
# Using database queries instead of in-memory index reduces memory usage by ~56MB per scan
# With indexed queries on file_path, performance impact is minimal
files.manager.useInMemoryIndex: false  # false = database queries (lower memory), true = in-memory index (legacy)

# -----------------------------------------------------------------------------
# Thread Pool Manager (TPM) Configuration
# -----------------------------------------------------------------------------
tpm.pool.max: 5  # Fixed value to avoid observable config issues
tpm.killTimeoutMs: 10000
tpm.thread.idleTimeoutSeconds: 120

# Thread Stack Size Optimization (Memory Savings) - REACTIVE CONFIG
# Reduces stack size from 8MB (macOS default) to 1MB per thread
# Memory savings: 7MB × 15 TPM threads = ~105MB additional reduction
# Changes take effect immediately (thread pool recreated on config change)
tpm.thread.stackSizeKB: 1024  # 1MB stack size (1024KB) instead of 8MB default

# TPM Type Shares
tpm.types.fileScan.share: 1

# -----------------------------------------------------------------------------
# HTTP Server Configuration (Memory Optimization)
# -----------------------------------------------------------------------------
# Configure HTTP server thread pool for single client + dedicated UI
# Reduces memory usage from ~6.8GB to ~350MB (saves ~5.4GB)
server.http.threadPool.maxThreads: 2    # Maximum HTTP threads (single client + UI)
server.http.threadPool.maxQueued: 10    # Maximum queued HTTP requests

# -----------------------------------------------------------------------------
# Files Manager Configuration
# -----------------------------------------------------------------------------
files.manager.enabled: true
files.manager.scan.intervalMs: 900000 # 15 minutes

# Files Service Configuration
files.service.immediateJobTrigger.enabled: true
files.service.immediateJobTrigger.timeoutMs: 30000

# -----------------------------------------------------------------------------
# Media Processor Configuration
# -----------------------------------------------------------------------------
media.processor.enabled: true
media.processor.intervalMs: 30000
# Unified media processor thread pool share
media.processor.threadPool.share.media_processor: 1.0

# Unified processing queue size limit to prevent memory buildup
media.processor.maxQueueSize: 100 # Maximum number of media processing tasks to queue (reduced for memory)

# -----------------------------------------------------------------------------
# Image Pipelines (SAFE TREO)
# -----------------------------------------------------------------------------
media.image.timeoutMs: 30000
media.image.retry.enabled: true
media.image.retry.maxAttempts: 2
media.image.retry.baseDelayMs: 500

media.image.fast.thumbSize: 256
media.image.balanced.resizeLongEdge: 1024
media.image.balanced.maxKeypoints: 1000

media.image.quality.onnx.modelPath: models/clip-image-vitb32.onnx
media.image.quality.onnx.inputSize: 224
media.image.quality.embeddingDim: 512

# ONNX Session Caching (CRITICAL for memory optimization in QUALITY mode)
# Reuses ONNX Runtime sessions instead of creating new ones for each image
# Memory savings: 100-500MB per session × max sessions = 400MB-2GB total
media.image.quality.onnx.sessionCache.enabled: true
media.image.quality.onnx.sessionCache.maxSessions: 4  # Max cached sessions per model (typically 2-4 for thread pool)

# Image Transcoding Configuration
media.image.transcoding.enabled: true
media.image.transcoding.timeoutMs: 60000
media.image.transcoding.preserveMetadata: true

# -----------------------------------------------------------------------------
# Media Type Configuration
# -----------------------------------------------------------------------------

