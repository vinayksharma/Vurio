# ============================================================================
# Media Deduplication Server - Configuration
# ============================================================================
# This file is monitored for changes and reloaded automatically (1s interval)
# Most settings take effect immediately without restart
# ============================================================================

# ============================================================================
# Server Settings
# ============================================================================
server.name: Media Deduplication Server
server.host: localhost
server.port: 8080
server.mode: fast                    # FAST | BALANCED | QUALITY - processing profile
server.processName: media_dedup_server
server.instanceCheck.enabled: true      # Prevent multiple server instances
server.instanceCheck.bufferSize: 128

# HTTP Server Thread Pool
server.http.threadPool.maxThreads: auto  # 'auto' = 75% of CPU cores + 1
server.http.threadPool.maxQueued: 50     # Request queue depth

# ============================================================================
# Database Settings
# ============================================================================
database.path: data/dedup_server.db
database.session.poolMin: 8              # Minimum connection pool size
database.session.poolMax: 32             # Maximum connection pool size
database.session.acquireTimeoutMs: 10000 # Max wait to acquire session
database.session.acquireBackoffMs: 50    # Retry backoff delay
database.sqlite.cacheSize: 1000          # SQLite cache pages
database.sqlite.tempStore: memory        # Use memory for temp tables

# ============================================================================
# Logging Settings
# ============================================================================
logging.level: .inf                      # trace | debug | info | warn | error

# ============================================================================
# Cache Settings
# ============================================================================
# Disk Cache (for transcoded files)
cache.disk.location: cache
cache.disk.size_limit_mb: 2048           # 2GB limit
cache.disk.clearOnStartup: true          # Clear temporary transcoded files

# Thumbnail Cache
cache.thumbnail.location: cache/thumbnails
cache.thumbnail.size_limit_mb: 10240     # 10GB limit
cache.thumbnail.clearOnStartup: false    # Persist thumbnails across restarts

# ============================================================================
# Thumbnail Generation Settings
# ============================================================================
thumbnail.pipeline.enabled: true         # Auto-generate thumbnails during processing
thumbnail.pipeline.size: 256             # Default size (pixels)
thumbnail.pipeline.onlyIfMissing: true   # Skip if thumbnail exists
thumbnail.default.size: 256
thumbnail.allowed.sizes: 128             # API allowed sizes
thumbnail.jpeg.quality: 85               # JPEG quality (0-100, higher = better)
thumbnail.generation.timeoutMs: 5000     # Per-thumbnail timeout

# ============================================================================
# Thread Pool Manager (TPM) Settings
# ============================================================================
tpm.pool.max: auto                       # 'auto' = 75% of CPU cores + 1
tpm.killTimeoutMs: 10000                 # Graceful shutdown timeout
tpm.thread.idleTimeoutSeconds: 120       # Thread reap timeout
tpm.thread.stackSizeKB: 1024             # Thread stack size

# TPM Task Type Shares (concurrency allocation)
tpm.types.media_processor.share: 1
tpm.types.image_processor.share: 1
tpm.types.audio_processor.share: 1
tpm.types.video_processor.share: 1
tpm.types.fileScan.share: 1
tpm.types.thumbnail_generator.share: 1
tpm.types.duplicate_finder.share: 1

# ============================================================================
# Scheduler Settings
# ============================================================================
scheduler.jobs: ""
scheduler.jitter.enabled: false          # Randomize schedule times
scheduler.jitter.percent: 0
scheduler.drift.mode: anchored           # anchored | floating
scheduler.drift.maxDriftMs: 60000
scheduler.maxConsecutiveFailures: 5

# Exponential Backoff (after failures)
scheduler.backoff.enabled: true
scheduler.backoff.initialMs: 1000
scheduler.backoff.multiplier: 2
scheduler.backoff.maxMs: 30000
scheduler.backoff.jitterPercent: 10

# ============================================================================
# Files Manager Settings
# ============================================================================
files.manager.enabled: true
files.manager.scan.intervalMs: 900000    # 15 minutes
files.manager.useInMemoryIndex: false

# Immediate Scan Trigger
files.service.immediateJobTrigger.enabled: true
files.service.immediateJobTrigger.timeoutMs: 30000

# ============================================================================
# Media Processor Settings
# ============================================================================
media.processor.enabled: true
media.processor.intervalMs: 5000         # Processing dispatch frequency
media.processor.maxQueueSize: 1000

# Image Processing
media.image.timeoutMs: 30000             # Per-image timeout
media.image.retry.enabled: true
media.image.retry.maxAttempts: 2
media.image.retry.baseDelayMs: 500

# Image Transcoding (RAW to JPEG conversion)
media.image.transcoding.enabled: true
media.image.transcoding.timeoutMs: 120000  # 2 minutes for large RAW files
media.image.transcoding.preserveMetadata: true

# ============================================================================
# Image Processing Pipeline Settings (Mode-Specific)
# ============================================================================

# FAST Mode - Perceptual Hash (pHash)
media.image.fast.thumbSize: 256          # Thumbnail size for pHash generation

# BALANCED Mode - ORB Feature Matching
media.image.balanced.resizeLongEdge: 1024    # Resize before feature detection
media.image.balanced.maxKeypoints: 1500      # Max features to detect (increased for accuracy)

# QUALITY Mode - CLIP Deep Learning Embeddings
media.image.quality.embeddingDim: 512        # CLIP embedding dimension
media.image.quality.onnx.modelPath: models/clip-image-vitb32.onnx
media.image.quality.onnx.inputSize: 224      # Input image size for CLIP
media.image.quality.onnx.sessionCache.enabled: true
media.image.quality.onnx.sessionCache.maxSessions: 4

# ============================================================================
# Duplicate Detection Settings
# ============================================================================
duplicates.finder.enabled: true
duplicates.finder.intervalMs: 5000       # Run every 5 seconds
duplicates.finder.batchSize: 1000        # Files per batch
duplicates.finder.maxGroupSize: 100      # Max duplicates per group
duplicates.representative.strategy: size_then_age  # Larger files preferred, then older

# FAST Mode - pHash Similarity Thresholds (STRICT FOR LOW FALSE POSITIVES)
duplicates.fast.threshold: 0.97          # STRICT: only 3 bits can differ out of 64 
duplicates.fast.minHashSize: 64          # pHash size in bits

# BALANCED Mode - Feature Matching Thresholds  
duplicates.balanced.threshold: 0.35      # 0.30-0.40 recommended (35% of features must match)
duplicates.balanced.minGoodMatches: 15   # Minimum absolute good matches required (0=disabled)
duplicates.balanced.ratioTestThreshold: 0.75  # Lowe's ratio test (0.60=strict, 0.85=loose)

# QUALITY Mode - Embedding Similarity Thresholds
duplicates.quality.threshold: 0.96       # 0.94-0.98 recommended (96% cosine similarity required)
duplicates.quality.minConfidence: 0.90   # Secondary confidence threshold (future use)

# Metadata Pre-Filtering (STRICT TO REDUCE FALSE POSITIVES)
duplicates.metadata.filtering.enabled: true           # Enable metadata pre-filtering before similarity calculation
duplicates.metadata.aspectRatioTolerance: 0.05        # STRICT: only 5% aspect ratio difference 
duplicates.metadata.dimensionTolerance: 0.10          # STRICT: only 10% dimension difference 
duplicates.metadata.fileSizeTolerance: 0.20           # STRICT: only 20% file size difference 
duplicates.metadata.requireSameFormat: false          # If true, only compare files with same extension

