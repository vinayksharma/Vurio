syntax = "proto3";

package vurio.dedup;

// ---------------------------------------------------------
// Security / pairing handshake
//
// Every gRPC call (except Handshake itself) must carry the per-instance session
// token in the "x-vurio-token" metadata header. A client obtains that token by
// presenting the server's startup cookie (read from a 0600 file only the same
// OS user can open) to Handshake. This binds a client to one server instance.
//
// BROKER-1: a UI then LOCKS the instance by holding the Session stream. While
// one is held, Handshake refuses every other caller ("BUSY: ..."), and the
// instance advertises itself as busy to the broker. When the stream ends —
// the UI quit or died — the instance shuts down: a server is single-use.
// ---------------------------------------------------------
service SecurityService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  // Requires the session token. The server writes a SessionEvent about once
  // a second for as long as the pairing stands; a second concurrent caller is
  // refused with ALREADY_EXISTS.
  rpc Session(SessionRequest) returns (stream SessionEvent);
}

message SessionRequest {
  // Free-form client identity for the server log (e.g. "VURIO pid 1234").
  string client_description = 1;
}

message SessionEvent {
  // Unix milliseconds at the server when the event was written.
  int64 timestamp_ms = 1;
}

message HandshakeRequest {
  string cookie = 1;
  // VER-1: client build identity, checked by the server. Version and commit
  // must equal the server's for pairing to succeed; branch/dirty are logged
  // only.
  string client_version = 2;
  string client_commit = 3;
  string client_branch = 4;
  bool client_dirty = 5;
}

message HandshakeResponse {
  bool ok = 1;
  string session_token = 2;
  string error_message = 3;
  // VER-1: server build identity. Filled whenever the cookie was valid
  // (success or version mismatch); left empty on cookie rejection so an
  // unpaired caller learns nothing about the build.
  string server_version = 4;
  string server_commit = 5;
  string server_branch = 6;
  bool server_dirty = 7;
}

// ---------------------------------------------------------
// Config & Settings Services
// ---------------------------------------------------------
service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
}

message GetConfigRequest {
  string key = 1; // empty for all
}

message GetConfigResponse {
  string json_payload = 1;
}

message UpdateConfigRequest {
  string key = 1;
  string value_json = 2;
}

message UpdateConfigResponse {
  bool success = 1;
  string error_message = 2;
}

// ---------------------------------------------------------
// Media Locations Service
// ---------------------------------------------------------
service MediaLocationsService {
  rpc RegisterLocation(RegisterLocationRequest) returns (RegisterLocationResponse);
  rpc DeregisterLocation(DeregisterLocationRequest) returns (DeregisterLocationResponse);
  rpc ChangePath(ChangePathRequest) returns (ChangePathResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Relink a disconnected media location: the user points to a file they
  // located on disk; the server validates it against stored metadata, derives
  // the new root, and remaps the whole location.
  rpc LocateMissingFile(LocateMissingFileRequest) returns (LocateMissingFileResponse);
}

message RegisterLocationRequest {
  string path = 1;
  // ADJ-1: optional folder for the location's edit files (sidecars). Empty =
  // the location itself. Refused (success=false) when another location
  // already uses it or nests with it.
  string edits_root = 2;
}

message RegisterLocationResponse {
  bool success = 1;
  string error_message = 2;
}

message DeregisterLocationRequest {
  string path = 1;
  // ADJ-1: also unlink the location's sidecar files (the user's choice in
  // the confirmation; the edit rows always go with the registration).
  bool delete_adjustment_files = 2;
}

message DeregisterLocationResponse {
  bool success = 1;
  string error_message = 2;
  int32 adjustment_files_deleted = 3; // ADJ-1
}

message ChangePathRequest {
  string old_path = 1;
  string new_path = 2;
}

message ChangePathResponse {
  bool success = 1;
  string error_message = 2;
  int32 files_updated = 3;
}

message LocateMissingFileRequest {
  string member_path = 1;  // path of a member file as stored in the DB (on the disconnected location)
  string located_path = 2; // the file the user pointed to on disk
}

message LocateMissingFileResponse {
  bool success = 1;
  string error_message = 2;
  int32 files_updated = 3;
  string old_path = 4; // old registered root
  string new_path = 5; // newly remapped root
}

message GetStatusRequest {}

message GetStatusResponse {
  repeated string registered_dirs = 1;
  int32 scanned_files_count = 2;
  int32 processed_files_count = 3;
  int32 error_files_count = 4;
  int32 thread_count = 5;
  int32 max_threads = 6;
  int32 duplicate_groups_count = 7;
  repeated string ejected_dirs = 8;
  int32 duplicate_files_count = 9;
  int32 duplicate_finding_total = 10;
  int32 duplicate_finding_completed = 11;
  bool is_paused = 12;
  // DF-5: edge re-discovery ("realignment") currently in flight — the queue
  // drained after a discovery-correctness fix, or files that finished behind
  // the id watermark. Both are 0 whenever no repair episode is running, which
  // is the signal the UI uses to hide the indicator entirely.
  int32 repair_total = 13;
  int32 repair_completed = 14;
  // FACE-1 sweep progress: eligible images vs images already face-scanned
  // at the current version. Rendered as a thin overlay on the status bar
  // (the repair-indicator pattern); equal (or zero) = hidden. Both stay 0
  // when media.face.enabled is off.
  int32 face_scan_total = 15;
  int32 face_scan_completed = 16;
  // ADJ-1: parallel to registered_dirs — the effective edits folder of each
  // location ("" when it is the location itself).
  repeated string edits_roots = 17;
}

// ---------------------------------------------------------
// FACE-3: People (face clusters)
// ---------------------------------------------------------

message FaceClusterInfo {
  int32 id = 1;
  string name = 2;          // empty = unnamed
  int32 face_count = 3;
  int32 file_count = 4;     // distinct photos
  // Cover face: crop the cover file's thumbnail with this normalized bbox
  // (top-left origin) client-side — no extra image RPC needed.
  string cover_file_path = 5;
  double cover_x = 6;
  double cover_y = 7;
  double cover_w = 8;
  double cover_h = 9;
  bool hidden = 10;
  // FACE-5: the person's alternative names ("mom", "ma"); search resolves
  // them like the canonical name (canonical wins on collision).
  repeated string aliases = 11;
  // FACE-6: the cover face was pinned by the user (survives automatic
  // quality-based re-election), and which face is the cover today — the
  // popup rings it so the user can see the current representative.
  bool cover_pinned = 12;
  int32 cover_face_id = 13;
  // CHAIN-5: the person this cluster is named as (0 = unnamed); the
  // faces mask's `person_ids` picker uses it.
  int32 person_id = 14;
}

message ListFaceClustersRequest {
  bool include_hidden = 1;
}

message ListFaceClustersResponse {
  repeated FaceClusterInfo clusters = 1; // size desc
}

message NameFaceClusterRequest {
  int32 cluster_id = 1;
  string name = 2; // empty clears the name
  repeated string aliases = 3; // FACE-5: replaces the person's alias set
}

message MergeFaceClustersRequest {
  int32 target_id = 1;
  repeated int32 source_ids = 2;
}

message SetFaceClusterHiddenRequest {
  int32 cluster_id = 1;
  bool hidden = 2;
}

message FaceClusterActionResponse {
  bool success = 1;
  string error_message = 2;
  // FACE-8: faces detached back to the unclustered pool by the merge-time
  // purge filter (0 when purging is disabled or nothing fell below the
  // cutoff). The client surfaces the count so members don't silently vanish.
  int32 purged_faces = 3;
}

// FACE-3b: the cluster's individual faces, for the review grid.
message ClusterFaceInfo {
  int32 face_id = 1;
  string file_path = 2;   // crop the thumbnail with the bbox client-side
  double x = 3;
  double y = 4;
  double w = 5;
  double h = 6;
  double quality = 7;
  // FACE-7d: the face's score against its own cluster (best of centroid and
  // exemplars, the exemplar set excluding the face itself). `suspect` marks
  // it for review in the popup — surfaced, never auto-removed; the pinned
  // cover is never suspect.
  double fit = 8;
  bool suspect = 9;
}

message ListClusterFacesRequest {
  int32 cluster_id = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message ListClusterFacesResponse {
  repeated ClusterFaceInfo faces = 1; // quality desc
  int32 total = 2;
}

// "Not this person": detach the face from its cluster, record a
// cannot-link so re-clustering never re-joins it (the constraint follows
// merges), and let the sweep's catch-up re-adopt the face elsewhere.
message RemoveFaceFromClusterRequest {
  int32 face_id = 1;
}

// FACE-7e "Regroup faces": dissolve the cluster — detach its faces
// (embeddings kept), delete the cluster/exemplars/pin, orphan-clean the
// person + aliases, drop cannot-links against it. The sweep's catch-up
// regroups the loose faces within a few ticks under current match rules.
message DissolveFaceClusterRequest {
  int32 cluster_id = 1;
}

// FACE-6: pin a specific face as the cluster's representative (cover) face.
// A pinned cover survives automatic quality-based re-election permanently;
// it unpins only when that face leaves the cluster.
message SetFaceClusterCoverRequest {
  int32 cluster_id = 1;
  int32 face_id = 2;
}

// ---------------------------------------------------------
// Duplicates Service
// ---------------------------------------------------------
service DuplicatesService {
  rpc GetDuplicateGroups(GetGroupsRequest) returns (GetGroupsResponse);
  // Day-based "ALL" view: every scanned file grouped by capture day
  // (EXIF datetime, falling back to file mtime, then scan time),
  // paginated over days (newest day first).
  rpc GetDayGroups(GetDayGroupsRequest) returns (GetDayGroupsResponse);
  // FACE-3: People tab.
  rpc ListFaceClusters(ListFaceClustersRequest) returns (ListFaceClustersResponse);
  rpc NameFaceCluster(NameFaceClusterRequest) returns (FaceClusterActionResponse);
  rpc MergeFaceClusters(MergeFaceClustersRequest) returns (FaceClusterActionResponse);
  rpc SetFaceClusterHidden(SetFaceClusterHiddenRequest) returns (FaceClusterActionResponse);
  rpc ListClusterFaces(ListClusterFacesRequest) returns (ListClusterFacesResponse);
  rpc RemoveFaceFromCluster(RemoveFaceFromClusterRequest) returns (FaceClusterActionResponse);
  rpc SetFaceClusterCover(SetFaceClusterCoverRequest) returns (FaceClusterActionResponse);
  rpc DissolveFaceCluster(DissolveFaceClusterRequest) returns (FaceClusterActionResponse);
  // Fetch more files for a single day (horizontal-scroll pagination within a
  // day row); offset/limit page over the day's files in taken_time order.
  rpc GetDayFiles(GetDayFilesRequest) returns (GetDayFilesResponse);
  rpc EjectDuplicates(EjectDuplicatesRequest) returns (EjectDuplicatesResponse);
  rpc UndoEjectDuplicates(UndoEjectDuplicatesRequest) returns (UndoEjectDuplicatesResponse);
  // Paths-only queries for bulk eject/restore: the client keeps its chunked
  // operation (per-chunk progress, cancellable between chunks) without first
  // downloading every group's full member payload just to build a path list.
  rpc GetEligibleDuplicatePaths(GetEligibleDuplicatePathsRequest) returns (DuplicatePathsResponse);
  rpc GetEjectedDuplicatePaths(Empty) returns (DuplicatePathsResponse);
  rpc SubscribeToDuplicateUpdates(Empty) returns (stream DuplicateGroupUpdate);
  // Current row index of one group in the BINNED display order. The client
  // uses it to re-anchor its scroll position after a re-cluster moves rows.
  rpc GetGroupIndex(GetGroupIndexRequest) returns (GetGroupIndexResponse);
}

message GetGroupIndexRequest {
  string group_id = 1;
}

message GetGroupIndexResponse {
  bool found = 1;  // false when the group no longer exists
  int32 index = 2; // 0-based row index in GetDuplicateGroups order
}

message GetEligibleDuplicatePathsRequest {
  // Max distance (1 - similarity_score) for a non-representative, not-yet-
  // ejected member to count as eligible; members with score <= 0 are treated
  // as distance 0 (exact duplicates). Mirrors the client-side slider rule.
  double tightness = 1;
}

message DuplicatePathsResponse {
  // Newest group first, best match first within a group — the same order the
  // BINNED view displays, so chunked progress walks the list top-down.
  repeated string file_paths = 1;
}

message GetGroupsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message DuplicateFile {
  string id = 1;
  string file_path = 2;
  int64 size_bytes = 3;
  string resolution = 4;
  bool is_representative = 5;
  double similarity_score = 6;
  bool is_ejected = 7;
  string cached_thumbnail_path = 8;
  bool is_available = 9; // false when the volume this file lives on is disconnected
  // THUMB-1: the image's DISPLAY geometry — the dimensions it will have once
  // rendered. Today that is the source's auto-oriented size; once the
  // non-destructive edit pipeline lands it is that size with the user's
  // crop/rotate chain applied (docs/todo_aspect_ratio_thumbnails.md §3.1).
  // 0 when unknown — the client falls back to a square tile.
  int32 display_width = 10;
  int32 display_height = 11;
  // STRIP-2: every cached thumbnail bucket that exists for this file, so the
  // client can pick the smallest one that covers its current tile size and
  // decode it straight from disk. cached_thumbnail_path stays as the
  // best fit for the 256 bucket (older clients).
  repeated CachedThumbnail cached_thumbnails = 12;
  // ADJ-1: the file's render revision (0 = no edits). Part of every
  // thumbnail cache key on the client; display_width/height above are the
  // post-edit geometry.
  int32 render_revision = 13;
}

// STRIP-2: one on-disk thumbnail asset of a file: its pixel bucket (128,
// 256, 512, 1024) and server-local path.
message CachedThumbnail {
  string path = 1;
  int32 size = 2;
}

message DuplicateGroup {
  string group_id = 1;
  repeated DuplicateFile files = 2;
}

message GetGroupsResponse {
  repeated DuplicateGroup groups = 1;
  int32 total_groups = 2;
}

message GetDayGroupsRequest {
  int32 limit = 1;         // days per page
  int32 offset = 2;        // day offset (0 = newest day)
  int32 files_per_day = 3; // max files returned per day (0 = all files)
  // Semantic text filter (CLIP text->image search). Empty = no filter.
  // When set, days/files are restricted to the ranked matches; each matched
  // file appears on its own capture day (group anchoring is bypassed).
  string search_query = 4;
  // The ai/xf toggles: select which PIPELINE answers the query. Only-ai
  // re-runs it as pure CLIP over the parsed semantic part (facts ignored);
  // only-xf as the fact algebra alone (no facts parsed => empty result).
  // Both true — or both false, from an older client — is the hybrid
  // default.
  bool search_include_ai = 5;
  bool search_include_exif = 6;
  // FACE-3: restrict the day view to one face cluster's photos (the People
  // tab drill-down). 0 = no filter. Combines with search_query by
  // intersection when both are set.
  int32 filter_cluster_id = 7;
  // Third route beside ai/xf: face facts (person names, face counts).
  // All three false, from an older client, is the everything-on default.
  bool search_include_face = 8;
}

message DayFile {
  string id = 1;
  string file_path = 2;
  string taken_time = 3; // normalized "YYYY-MM-DD HH:MM:SS"
  int64 size_bytes = 4;
  string cached_thumbnail_path = 5;
  bool is_ejected = 6;
  bool is_available = 7; // false when the volume this file lives on is disconnected
  string group_id = 8;   // duplicate group id; empty when the file is unique
  bool is_representative = 9;
  double similarity_score = 10;
  int32 display_width = 11;  // THUMB-1, see DuplicateFile
  int32 display_height = 12;
  // How the active search_query admitted THIS file (all false when no
  // search is active): matched_ai = CLIP ranked it for the semantic text;
  // matched_exif = it satisfied the parsed EXIF constraints; matched_face =
  // it satisfied the parsed face facts (person names, face counts). Results
  // are a union of the routes, so any combination can appear.
  bool matched_ai = 13;
  bool matched_exif = 14;
  bool matched_face = 15;
  repeated CachedThumbnail cached_thumbnails = 16; // STRIP-2, see DuplicateFile
  // PLACE-1: where the photo was taken, most specific first
  // ("Fairy Falls · Yellowstone National Park · Wyoming"); empty when the
  // file has no GPS fix or it has not been resolved yet.
  string place_label = 17;
  int32 render_revision = 18; // ADJ-1, see DuplicateFile
}

message DayGroup {
  string day = 1;               // "YYYY-MM-DD"
  repeated DayFile files = 2;   // ascending taken_time; may be a prefix when
                                // GetDayGroupsRequest.files_per_day is set
  int32 total_files = 3;        // total files in this day
}

message GetDayGroupsResponse {
  repeated DayGroup days = 1;
  int32 total_days = 2;
  // Which routes of the hybrid search RAN for the active query (all false
  // when no query): search_used_ai = the CLIP semantic half succeeded;
  // search_used_exif = EXIF constraints were parsed and evaluated;
  // search_used_face = face facts (person names, face counts) were parsed
  // and evaluated. Per-file attribution lives on DayFile.matched_*.
  bool search_used_ai = 3;
  bool search_used_exif = 4;
  bool search_used_face = 6;
  // True when the query was answered by the fallback pattern parser even
  // though the LLM structurer was expected to run (model failed, stalled,
  // or its output was fully rejected). Fact semantics may be simplified —
  // e.g. camera MODEL names are only understood by the LLM path. Lets the
  // client show "simplified query parsing" instead of degrading silently.
  bool search_parse_degraded = 5;
  // How many files of the active query's result set each route admitted
  // (0 when no query, and after filter_cluster_id has been intersected in,
  // so they always describe the set the day list is actually showing). The
  // routes overlap — a file matched by both ai and xf counts in both — so
  // these do not sum to the total. Drives the per-route counts on the
  // ai/xf/fc chips.
  int32 search_match_count_ai = 7;
  int32 search_match_count_exif = 8;
  int32 search_match_count_face = 9;
}

message GetDayFilesRequest {
  string day = 1;   // "YYYY-MM-DD"
  int32 offset = 2; // file offset within the day (taken_time order)
  int32 limit = 3;
  // Must match the search_query the day list was fetched with (or empty).
  string search_query = 4;
  bool search_include_ai = 5;   // see GetDayGroupsRequest
  bool search_include_exif = 6;
  int32 filter_cluster_id = 7;
  bool search_include_face = 8;
}

message GetDayFilesResponse {
  repeated DayFile files = 1;
  int32 total_files = 2; // total files in this day
  bool search_used_ai = 3;   // see GetDayGroupsResponse
  bool search_used_exif = 4;
  bool search_parse_degraded = 5;
  bool search_used_face = 6;
}

message EjectDuplicatesRequest {
  repeated string file_paths = 1;
}

message EjectDuplicatesResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
  int32 skipped_unavailable = 5; // files skipped because their volume is disconnected
}

message UndoEjectDuplicatesRequest {
  repeated string file_paths = 1;
  bool undo_all = 2;
}

message UndoEjectDuplicatesResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
  int32 skipped_unavailable = 5; // files skipped because their volume is disconnected
}

message DuplicateGroupUpdate {
  enum UpdateType {
    ADDED = 0;
    UPDATED = 1;
    DELETED = 2;
    // The finder re-clustered: groups may have been added, dropped, merged or
    // re-ordered (a new representative changes a group's capture date, which
    // is what the list sorts on). No per-row delta is meaningful, so the
    // client re-fetches its loaded pages and re-anchors its scroll position.
    // `index` and `group` are unset.
    RELOAD = 3;
  }
  UpdateType type = 1;
  int32 index = 2;
  DuplicateGroup group = 3;
}

// ---------------------------------------------------------
// Advanced Settings Service
// ---------------------------------------------------------
service AdvancedSettingsService {
  rpc ResetErrors(Empty) returns (AdvancedActionResponse);
  rpc EjectErrors(Empty) returns (AdvancedActionResponse);
  rpc UndoEjectErrors(Empty) returns (AdvancedActionResponse);
  
  rpc EjectIgnored(Empty) returns (AdvancedActionResponse);
  rpc UndoEjectIgnored(Empty) returns (AdvancedActionResponse);
  
  rpc PurgeEjectedAndErrored(Empty) returns (AdvancedActionResponse);
  rpc ResetDuplicates(Empty) returns (AdvancedActionResponse);
  // FACE-8b: wipe the people layer — every cluster, person, alias,
  // cannot-link, exemplar and pin. Detected faces and embeddings stay; the
  // sweep regroups from scratch (fresh unnamed clusters within ticks).
  rpc ClearAllFaceGroups(Empty) returns (AdvancedActionResponse);
  
  rpc PauseProcessing(Empty) returns (AdvancedActionResponse);
  rpc ResumeProcessing(Empty) returns (AdvancedActionResponse);
  
  rpc StartDatabaseIntegrityCheck(Empty) returns (AdvancedActionResponse);
  rpc GetDatabaseIntegrityCheckStatus(Empty) returns (IntegrityCheckStatusResponse);
  
  
  rpc ClearAllCaches(Empty) returns (ClearCachesResponse);
  
  rpc ConfigurePurityOrder(ConfigurePurityOrderRequest) returns (AdvancedActionResponse);
  
  rpc GetUserTheme(Empty) returns (GetUserThemeResponse);
  rpc SetUserTheme(SetUserThemeRequest) returns (AdvancedActionResponse);
}

message Empty {}

message AdvancedActionResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
}

message IntegrityCheckStatusResponse {
  bool running = 1;
  int32 progress = 2;
  int32 total_files = 3;
  int32 processed_files = 4;
  int32 files_removed = 5;
  int32 groups_removed = 6;
  int32 thumbnails_removed = 7;
  int32 artifacts_removed = 8;
  int32 errors_removed = 9;
  string current_phase = 10;
}

message ClearCachesResponse {
  bool success = 1;
  bool thumbnail_cache_cleared = 2;
  bool disk_cache_cleared = 3;
  string error_message = 4;
}

message ConfigurePurityOrderRequest {
  string purity_order = 1;
}

message GetUserThemeResponse {
  string theme = 1;
}

message SetUserThemeRequest {
  string theme = 1;
}

// ---------------------------------------------------------
// Media Service
// ---------------------------------------------------------
service MediaService {
  rpc GetThumbnail(GetMediaRequest) returns (MediaPathResponse);
  rpc GetPreview(GetMediaRequest) returns (MediaPathResponse);
  rpc CancelMediaGeneration(CancelMediaRequest) returns (Empty);
  // Pushes an event whenever an async thumbnail/preview generation finishes
  // (success or failure), so clients don't have to poll GetThumbnail/GetPreview
  // on a guessed schedule after an UNAVAILABLE "generating" answer.
  rpc SubscribeToMediaReady(Empty) returns (stream MediaReadyEvent);
}

message GetMediaRequest {
  string file_path = 1;
  string size = 2;
  // STRIP-2: drop the cached asset that would have been served (the client
  // could not decode it) and generate it again.
  bool regenerate = 3;
  // ADJ-1: informational; the server resolves the file's current revision
  // itself and echoes it in MediaPathResponse.render_revision.
  int32 render_revision = 4;
}

message CancelMediaRequest {
  string file_path = 1;
  string type = 2;
  // STRIP-2: thumbnail generations are queued per (path, size bucket); 0
  // targets the legacy path-only key.
  int32 size = 3;
}

message MediaPathResponse {
  string file_path = 1;
  // True when the returned path is already full resolution (the original
  // file, or a cached full-res render) — the viewer can skip its zoom-time
  // full-resolution upgrade.
  bool is_full_resolution = 2;
  // ADJ-1: the revision the served asset was rendered at (thumbnails and
  // native renders carry the edits; the QHD preview is base pixels and the
  // viewer applies the chain itself).
  int32 render_revision = 3;
}

message MediaReadyEvent {
  string file_path = 1;
  string media_type = 2; // "thumbnail" | "preview" | "preview_full" | "adjustments" | "mask" (CHAIN-5: a detected mask finished) | "export" (CHAIN-6: an export finished; success says how)
  bool success = 3;
  string error_message = 4; // set when success == false
  // STRIP-2: pixel bucket of a finished thumbnail; 0 for previews and for
  // events from paths that do not know the size.
  int32 size = 5;
  // ADJ-1: media_type "adjustments" — the file's edits changed. The new
  // revision and display geometry let the client re-key its caches and
  // reshape the tile without reloading the list.
  int32 render_revision = 6;
  int32 display_width = 7;
  int32 display_height = 8;
}

// ---------------------------------------------------------
// Adjustments Service (ADJ-1, docs/todo_image_adjustments.md §5.8)
//
// Non-destructive per-image edits. The document crosses the wire as JSON
// (the sidecar body), so adding a tool never changes this file. Limits and
// defaults come from DescribeTools: the client builds its controls from
// them and never hard-codes a range.
// ---------------------------------------------------------
service AdjustmentsService {
  rpc DescribeTools(Empty) returns (ToolDescriptors);
  rpc GetAdjustments(AdjustmentsFileRequest) returns (AdjustmentDocumentResponse);
  // Validates, stores, writes the sidecar (or spools it), invalidates the
  // file's cached renders and pushes a MediaReadyEvent "adjustments".
  // INVALID_ARGUMENT carries the tool's error text; NOT_FOUND = unregistered.
  rpc SetAdjustments(SetAdjustmentsRequest) returns (SetAdjustmentsResponse);
  // Per-location edits folder (default: the location itself).
  rpc GetEditsRoot(EditsRootRequest) returns (EditsRootResponse);
  // "" = back to the default. Existing sidecars are moved into the new
  // layout. Refused when another location uses or nests with the folder.
  rpc SetEditsRoot(SetEditsRootRequest) returns (SetEditsRootResponse);
  // CHAIN-1 (docs/todo_tool_chain.md §9.2): move through the photo's
  // persisted undo/redo history. `delta` steps relative to the current
  // index (-1 undo, +1 redo); `use_index` jumps to `index`. The step's
  // chain is committed like any edit (without appending a new step) and the
  // resulting document is returned. OUT_OF_RANGE when there is no such step.
  rpc StepHistory(StepHistoryRequest) returns (AdjustmentDocumentResponse);
  // CHAIN-7e: save / restore / rename / delete a named snapshot of the chain.
  rpc SnapshotHistory(SnapshotRequest) returns (AdjustmentDocumentResponse);
  // CHAIN-5 (docs §9.3): detected-mask backends, models and cache.
  rpc MaskStatus(Empty) returns (MaskStatusResponse);
  rpc ClearMaskCache(Empty) returns (MaskStatusResponse);
  // CHAIN-6 (docs §8): render the chain at full resolution and write a NEW
  // file into `folder`. The source is never touched; an existing name is
  // never reused (" (2)", " (3)"…); no sidecar, no embedded chain. Not
  // registered: a folder inside a location is seen by the ordinary scan.
  // INVALID_ARGUMENT: format/quality/folder; NOT_FOUND: unregistered or
  // missing file; PERMISSION_DENIED: folder not writable; INTERNAL: decode
  // or encode failed. A MediaReadyEvent "export" follows every attempt.
  rpc ExportRendered(ExportRequest) returns (ExportResponse);
}

message ExportRequest {
  string file_path = 1;
  string folder = 2;      // destination directory the user picked
  string format = 3;      // "jpeg" | "png" | "tiff" ("" = server default)
  int32 quality = 4;      // JPEG 1..100 (0 = server default)
  int32 max_side = 5;     // long-side limit in pixels (0 = native)
  string name_suffix = 6; // <stem>-<suffix>.<ext>; "" = the applied recipe's name or "edit"
}

message ExportResponse {
  string written_path = 1;
  int32 width = 2;
  int32 height = 3;
  bool exif_copied = 4;
  string warning = 5;     // why EXIF was not (fully) copied, when it was not
}

// ---------------------------------------------------------
// Recipes Service (CHAIN-3, docs/todo_tool_chain.md §7)
//
// Named chains saved from a photo, validated at save, import and apply,
// applied to other photos, exported to and imported from
// `.vurio-recipes.json`. The client reads and writes the files; the server
// stays out of the user's folders.
// ---------------------------------------------------------
service RecipesService {
  rpc ListRecipes(Empty) returns (RecipeList);
  // INVALID_ARGUMENT: the chain was refused (message names the node);
  // ALREADY_EXISTS: the name is taken; NOT_FOUND: from_file_path has no edits.
  rpc SaveRecipe(SaveRecipeRequest) returns (RecipeResponse);
  rpc UpdateRecipe(UpdateRecipeRequest) returns (RecipeResponse);
  rpc DeleteRecipe(RecipeIdRequest) returns (Empty);
  // Compile + validate a chain, against a photo's base when file_path is set.
  rpc ValidateChain(ValidateChainRequest) returns (ValidateChainResponse);
  // Commits the recipe onto the photo as one history step.
  rpc ApplyRecipe(ApplyRecipeRequest) returns (SetAdjustmentsResponse);
  rpc ExportRecipes(RecipeIdsRequest) returns (RecipesFile);
  rpc ImportRecipes(ImportRecipesRequest) returns (ImportRecipesResult);
}

message Recipe {
  string id = 1;
  string name = 2;
  string description = 3;
  string chain_json = 4;       // the node array
  int32 node_count = 5;
  bool includes_geometry = 6;
  string source = 7;           // "user" | "imported" | "builtin"
  int64 created_at = 8;        // unix seconds
  int64 updated_at = 9;
}

message RecipeList {
  repeated Recipe recipes = 1; // by name
}

message SaveRecipeRequest {
  string name = 1;
  string description = 2;
  string chain_json = 3;       // a node array or a whole document; ignored when from_file_path is set
  string from_file_path = 4;   // save the photo's committed chain
  bool include_geometry = 5;   // keep crop and rotation nodes (off by default)
}

message RecipeResponse {
  bool success = 1;
  string error_message = 2;
  Recipe recipe = 3;
}

message UpdateRecipeRequest {
  string id = 1;
  string name = 2;             // "" = keep
  string description = 3;
  bool set_chain = 4;
  string chain_json = 5;
}

message RecipeIdRequest {
  string id = 1;
}

message ValidateChainRequest {
  string chain_json = 1;
  string file_path = 2;        // optional
}

message ValidateChainResponse {
  bool ok = 1;
  string error_message = 2;
  int32 node_count = 3;
}

message ApplyRecipeRequest {
  string file_path = 1;
  string recipe_id = 2;
  string mode = 3;             // "replace" | "append" | "insert"
  int32 index = 4;             // insert position
}

message RecipeIdsRequest {
  repeated string ids = 1;     // empty = all
}

message RecipesFile {
  string json = 1;
}

message ImportRecipesRequest {
  string json = 1;
  string conflict_policy = 2;  // "keep_both" | "replace" | "skip"
}

message ImportOutcome {
  string name = 1;
  string outcome = 2;          // imported | renamed | replaced | skipped | error
  string message = 3;
}

message ImportRecipesResult {
  bool success = 1;            // the file was readable
  string error_message = 2;
  int32 imported = 3;
  int32 replaced = 4;
  int32 skipped = 5;
  repeated ImportOutcome outcomes = 6;
}

// ---------------------------------------------------------
// Preview Service (CHAIN-1, docs/todo_tool_chain.md §5.4)
//
// The viewer's live preview. Every frame is rendered by the server's engine
// from the file's decoded working-size base, through the chain the client
// is editing (committed or not). One request in flight per client; the
// client sends the newest document when the previous frame returns.
// ---------------------------------------------------------
service PreviewService {
  rpc RenderPreview(RenderPreviewRequest) returns (PreviewFrame);
  // Drop the file's render session (decoded base + node cache) early;
  // sessions also expire on their own.
  rpc ReleasePreview(AdjustmentsFileRequest) returns (Empty);
}

message RenderPreviewRequest {
  string file_path = 1;
  string document_json = 2;    // the chain being edited; "" = the committed one
  int32 max_side = 3;          // longest side of the frame (1280 while dragging, 2560 at rest)
  int32 quality = 4;           // JPEG quality; 0 = server default
  int64 seq = 5;               // echoed so the client can drop stale frames
  // Crop editing: render the chain only up to (not including) this node, so
  // the frame is exactly the canvas that node receives.
  string truncate_at_node_id = 6;
  bool before = 7;             // before/after: render the base image
  // CHAIN-4: view modes for lanes — the lane alone over mid-grey, or the
  // lane's coverage tinted red on the normal render.
  string solo_lane_id = 8;
  string overlay_lane_id = 9;
}

message PreviewFrame {
  bytes jpeg = 1;
  int32 width = 2;             // frame pixels
  int32 height = 3;
  int64 seq = 4;
  int32 render_ms = 5;         // engine + encode time, for the debug overlay
  int32 base_width = 6;        // the full-resolution base (EXIF-oriented)
  int32 base_height = 7;
  int32 display_width = 8;     // full-resolution size of what the frame shows
  int32 display_height = 9;
  // CHAIN-4 (docs §3.4): normalised base coordinates → frame pixels, for
  // mask pins drawn over the frame. 9 values, a row-major 3×3 homography
  // since CHAIN-7f (Perspective); a client may still receive the 6 values
  // of a 2×3 affine from an older server.
  repeated double base_to_canvas = 10;
  // CHAIN-5 (docs §5.6): lanes whose detected mask is still computing;
  // they rendered as no-ops. A MediaReadyEvent "mask" follows.
  repeated string pending_lane_ids = 11;
}

// CHAIN-5: one detected mask source's backend and model state.
message MaskSourceStatus {
  string id = 1;            // subject | people | faces | prompt
  string backend = 2;       // vision | onnx | database
  string model_path = 3;
  bool available = 4;
  bool model_present = 5;
  bool loaded = 6;
  string note = 7;
}

message MaskStatusResponse {
  repeated MaskSourceStatus sources = 1;
  int64 cache_bytes = 2;    // detected-mask PNGs on disk
  int32 cache_files = 3;
  int32 pending = 4;        // detections queued or running
  bool enabled = 5;
}

message StepHistoryRequest {
  string file_path = 1;
  int32 delta = 2;
  int32 index = 3;
  bool use_index = 4;
}

message HistoryStep {
  string label = 1;
  string at = 2; // ISO-8601 UTC
}

// CHAIN-7e: a named copy of the chain beside the undo stack.
message HistorySnapshot {
  string id = 1;
  string name = 2;
  string at = 3; // ISO-8601 UTC
  int32 node_count = 4;
}

message SnapshotRequest {
  string file_path = 1;
  string action = 2;      // "save" | "restore" | "rename" | "delete"
  string name = 3;        // save, rename ("" on save = "Snapshot N")
  string snapshot_id = 4; // restore, rename, delete
}

message ParamSpec {
  string id = 1;
  string label = 2;
  string kind = 3; // "number" | "integer" | "enum" | "bool" | "text" | "curve" | "strokes" (CHAIN-7)
  double min = 4;
  double max = 5;
  double step = 6;          // 0 = continuous
  double default_value = 7; // number/integer
  string default_option = 8; // enum
  repeated string options = 9;
  // CHAIN-7: array-valued kinds carry their default as JSON — "curve" is
  // [[x, y], …] (2..16 points, x strictly increasing in [0,1]), "strokes" is
  // [{r, e, p: [[x, y], …]}, …] in base space (≤ 200 strokes).
  string default_json = 10;
  // CHAIN-7: params sharing a group are shown one group at a time behind a
  // chip row (HSL's bands, Curves' channels); empty = ungrouped.
  string group = 11;
}

message ToolDescriptor {
  string id = 1;    // "rotate", "crop" — also the node's "tool" value
  string label = 2;
  int32 version = 3; // the params version this build writes
  repeated ParamSpec params = 4;
  // CHAIN-1 (docs/todo_tool_chain.md §3.2, §5.6): how the engine composes
  // the tool and where it may be placed.
  string category = 5;         // "geometry" | "raster" | "layer" | "mask" | "split"
  string icon = 6;             // SF Symbol name for the catalogue and chain rows
  bool lane_allowed = 7;       // false for geometry (a lane must keep its canvas)
  bool resolution_dependent = 8;
  string summary = 9;          // chain-row text template, "{param:fmt}" placeholders
  bool active_at_defaults = 10; // the tool changes pixels even with every param at its default (Monochrome)
}

message ToolDescriptors {
  repeated ToolDescriptor tools = 1; // catalogue order (by category, then label)
  int32 document_version = 2;        // the document format version this build writes
  repeated string blend_modes = 3;   // CHAIN-1: the blend names a layer node may carry
  repeated ToolDescriptor mask_sources = 4; // CHAIN-4: the lane mask sources (category "mask")
  string export_default_format = 5;  // CHAIN-6: media.adjustments.export.defaultFormat
  int32 export_default_quality = 6;  // CHAIN-6: media.adjustments.export.defaultQuality
}

message AdjustmentsFileRequest {
  string file_path = 1;
}

message AdjustmentDocumentResponse {
  bool has_adjustments = 1;
  string document_json = 2;   // full sidecar body; empty when none
  int32 render_revision = 3;  // 0 = none
  int32 display_width = 4;    // post-edit geometry (0 = unknown)
  int32 display_height = 5;
  bool sidecar_spooled = 6;   // the sidecar waits for its folder to be reachable
  string sidecar_path = 7;    // where it is (destination or spool)
  // CHAIN-1: the photo's persisted undo/redo history (docs §4).
  int32 history_index = 8;
  repeated HistoryStep history_steps = 9;
  repeated HistorySnapshot snapshots = 10; // CHAIN-7e
}

message SetAdjustmentsRequest {
  string file_path = 1;
  string document_json = 2;   // a complete document; an empty chain with no history deletes the edit
  string step_label = 3;      // CHAIN-1: what this edit did, for the History list ("Rotate −2.5°")
}

message SetAdjustmentsResponse {
  bool success = 1;
  string error_message = 2;
  int32 render_revision = 3;
  int32 display_width = 4;
  int32 display_height = 5;
  bool sidecar_spooled = 6;
  string sidecar_path = 7;
  // CHAIN-1: history after this commit.
  int32 history_index = 8;
  repeated HistoryStep history_steps = 9;
  repeated HistorySnapshot snapshots = 10; // CHAIN-7e
}

message EditsRootRequest {
  string location_path = 1;
}

message EditsRootResponse {
  string edits_root = 1;   // effective folder
  bool is_default = 2;     // true when it is the location itself
  int32 sidecar_count = 3; // delivered sidecars for this location
  int32 spooled_count = 4; // sidecars waiting in the spool
}

message SetEditsRootRequest {
  string location_path = 1;
  string edits_root = 2;   // "" = default
}

message SetEditsRootResponse {
  bool success = 1;
  string error_message = 2;
  int32 moved = 3;
  int32 failed = 4;
  string conflicting_location = 5; // set when refused as shared/nested
}
