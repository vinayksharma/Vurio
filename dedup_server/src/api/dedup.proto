syntax = "proto3";

package vurio.dedup;

// ---------------------------------------------------------
// Security / pairing handshake
//
// Every gRPC call (except Handshake itself) must carry the per-instance session
// token in the "x-vurio-token" metadata header. A client obtains that token by
// presenting the server's startup cookie (read from a 0600 file only the same
// OS user can open) to Handshake. This binds a client to one server instance.
// ---------------------------------------------------------
service SecurityService {
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
}

message HandshakeRequest {
  string cookie = 1;
}

message HandshakeResponse {
  bool ok = 1;
  string session_token = 2;
  string error_message = 3;
}

// ---------------------------------------------------------
// Config & Settings Services
// ---------------------------------------------------------
service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
}

message GetConfigRequest {
  string key = 1; // empty for all
}

message GetConfigResponse {
  string json_payload = 1;
}

message UpdateConfigRequest {
  string key = 1;
  string value_json = 2;
}

message UpdateConfigResponse {
  bool success = 1;
  string error_message = 2;
}

// ---------------------------------------------------------
// Media Locations Service
// ---------------------------------------------------------
service MediaLocationsService {
  rpc RegisterLocation(RegisterLocationRequest) returns (RegisterLocationResponse);
  rpc DeregisterLocation(DeregisterLocationRequest) returns (DeregisterLocationResponse);
  rpc ChangePath(ChangePathRequest) returns (ChangePathResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Relink a disconnected media location: the user points to a file they
  // located on disk; the server validates it against stored metadata, derives
  // the new root, and remaps the whole location.
  rpc LocateMissingFile(LocateMissingFileRequest) returns (LocateMissingFileResponse);
}

message RegisterLocationRequest {
  string path = 1;
}

message RegisterLocationResponse {
  bool success = 1;
  string error_message = 2;
}

message DeregisterLocationRequest {
  string path = 1;
}

message DeregisterLocationResponse {
  bool success = 1;
  string error_message = 2;
}

message ChangePathRequest {
  string old_path = 1;
  string new_path = 2;
}

message ChangePathResponse {
  bool success = 1;
  string error_message = 2;
  int32 files_updated = 3;
}

message LocateMissingFileRequest {
  string member_path = 1;  // path of a member file as stored in the DB (on the disconnected location)
  string located_path = 2; // the file the user pointed to on disk
}

message LocateMissingFileResponse {
  bool success = 1;
  string error_message = 2;
  int32 files_updated = 3;
  string old_path = 4; // old registered root
  string new_path = 5; // newly remapped root
}

message GetStatusRequest {}

message GetStatusResponse {
  repeated string registered_dirs = 1;
  int32 scanned_files_count = 2;
  int32 processed_files_count = 3;
  int32 error_files_count = 4;
  int32 thread_count = 5;
  int32 max_threads = 6;
  int32 duplicate_groups_count = 7;
  repeated string ejected_dirs = 8;
  int32 duplicate_files_count = 9;
  int32 duplicate_finding_total = 10;
  int32 duplicate_finding_completed = 11;
  bool is_paused = 12;
  // DF-5: edge re-discovery ("realignment") currently in flight — the queue
  // drained after a discovery-correctness fix, or files that finished behind
  // the id watermark. Both are 0 whenever no repair episode is running, which
  // is the signal the UI uses to hide the indicator entirely.
  int32 repair_total = 13;
  int32 repair_completed = 14;
}

// ---------------------------------------------------------
// Duplicates Service
// ---------------------------------------------------------
service DuplicatesService {
  rpc GetDuplicateGroups(GetGroupsRequest) returns (GetGroupsResponse);
  // Day-based "ALL" view: every scanned file grouped by capture day
  // (EXIF datetime, falling back to file mtime, then scan time),
  // paginated over days (newest day first).
  rpc GetDayGroups(GetDayGroupsRequest) returns (GetDayGroupsResponse);
  // Fetch more files for a single day (horizontal-scroll pagination within a
  // day row); offset/limit page over the day's files in taken_time order.
  rpc GetDayFiles(GetDayFilesRequest) returns (GetDayFilesResponse);
  rpc EjectDuplicates(EjectDuplicatesRequest) returns (EjectDuplicatesResponse);
  rpc UndoEjectDuplicates(UndoEjectDuplicatesRequest) returns (UndoEjectDuplicatesResponse);
  // Paths-only queries for bulk eject/restore: the client keeps its chunked
  // operation (per-chunk progress, cancellable between chunks) without first
  // downloading every group's full member payload just to build a path list.
  rpc GetEligibleDuplicatePaths(GetEligibleDuplicatePathsRequest) returns (DuplicatePathsResponse);
  rpc GetEjectedDuplicatePaths(Empty) returns (DuplicatePathsResponse);
  rpc SubscribeToDuplicateUpdates(Empty) returns (stream DuplicateGroupUpdate);
  // Current row index of one group in the BINNED display order. The client
  // uses it to re-anchor its scroll position after a re-cluster moves rows.
  rpc GetGroupIndex(GetGroupIndexRequest) returns (GetGroupIndexResponse);
}

message GetGroupIndexRequest {
  string group_id = 1;
}

message GetGroupIndexResponse {
  bool found = 1;  // false when the group no longer exists
  int32 index = 2; // 0-based row index in GetDuplicateGroups order
}

message GetEligibleDuplicatePathsRequest {
  // Max distance (1 - similarity_score) for a non-representative, not-yet-
  // ejected member to count as eligible; members with score <= 0 are treated
  // as distance 0 (exact duplicates). Mirrors the client-side slider rule.
  double tightness = 1;
}

message DuplicatePathsResponse {
  // Newest group first, best match first within a group — the same order the
  // BINNED view displays, so chunked progress walks the list top-down.
  repeated string file_paths = 1;
}

message GetGroupsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message DuplicateFile {
  string id = 1;
  string file_path = 2;
  int64 size_bytes = 3;
  string resolution = 4;
  bool is_representative = 5;
  double similarity_score = 6;
  bool is_ejected = 7;
  string cached_thumbnail_path = 8;
  bool is_available = 9; // false when the volume this file lives on is disconnected
  // THUMB-1: the image's DISPLAY geometry — the dimensions it will have once
  // rendered. Today that is the source's auto-oriented size; once the
  // non-destructive edit pipeline lands it is that size with the user's
  // crop/rotate chain applied (docs/todo_aspect_ratio_thumbnails.md §3.1).
  // 0 when unknown — the client falls back to a square tile.
  int32 display_width = 10;
  int32 display_height = 11;
}

message DuplicateGroup {
  string group_id = 1;
  repeated DuplicateFile files = 2;
}

message GetGroupsResponse {
  repeated DuplicateGroup groups = 1;
  int32 total_groups = 2;
}

message GetDayGroupsRequest {
  int32 limit = 1;         // days per page
  int32 offset = 2;        // day offset (0 = newest day)
  int32 files_per_day = 3; // max files returned per day (0 = all files)
  // Semantic text filter (CLIP text->image search). Empty = no filter.
  // When set, days/files are restricted to the ranked matches; each matched
  // file appears on its own capture day (group anchoring is bypassed).
  string search_query = 4;
}

message DayFile {
  string id = 1;
  string file_path = 2;
  string taken_time = 3; // normalized "YYYY-MM-DD HH:MM:SS"
  int64 size_bytes = 4;
  string cached_thumbnail_path = 5;
  bool is_ejected = 6;
  bool is_available = 7; // false when the volume this file lives on is disconnected
  string group_id = 8;   // duplicate group id; empty when the file is unique
  bool is_representative = 9;
  double similarity_score = 10;
  int32 display_width = 11;  // THUMB-1, see DuplicateFile
  int32 display_height = 12;
}

message DayGroup {
  string day = 1;               // "YYYY-MM-DD"
  repeated DayFile files = 2;   // ascending taken_time; may be a prefix when
                                // GetDayGroupsRequest.files_per_day is set
  int32 total_files = 3;        // total files in this day
}

message GetDayGroupsResponse {
  repeated DayGroup days = 1;
  int32 total_days = 2;
}

message GetDayFilesRequest {
  string day = 1;   // "YYYY-MM-DD"
  int32 offset = 2; // file offset within the day (taken_time order)
  int32 limit = 3;
  // Must match the search_query the day list was fetched with (or empty).
  string search_query = 4;
}

message GetDayFilesResponse {
  repeated DayFile files = 1;
  int32 total_files = 2; // total files in this day
}

message EjectDuplicatesRequest {
  repeated string file_paths = 1;
}

message EjectDuplicatesResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
  int32 skipped_unavailable = 5; // files skipped because their volume is disconnected
}

message UndoEjectDuplicatesRequest {
  repeated string file_paths = 1;
  bool undo_all = 2;
}

message UndoEjectDuplicatesResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
  int32 skipped_unavailable = 5; // files skipped because their volume is disconnected
}

message DuplicateGroupUpdate {
  enum UpdateType {
    ADDED = 0;
    UPDATED = 1;
    DELETED = 2;
    // The finder re-clustered: groups may have been added, dropped, merged or
    // re-ordered (a new representative changes a group's capture date, which
    // is what the list sorts on). No per-row delta is meaningful, so the
    // client re-fetches its loaded pages and re-anchors its scroll position.
    // `index` and `group` are unset.
    RELOAD = 3;
  }
  UpdateType type = 1;
  int32 index = 2;
  DuplicateGroup group = 3;
}

// ---------------------------------------------------------
// Advanced Settings Service
// ---------------------------------------------------------
service AdvancedSettingsService {
  rpc ResetErrors(Empty) returns (AdvancedActionResponse);
  rpc EjectErrors(Empty) returns (AdvancedActionResponse);
  rpc UndoEjectErrors(Empty) returns (AdvancedActionResponse);
  
  rpc EjectIgnored(Empty) returns (AdvancedActionResponse);
  rpc UndoEjectIgnored(Empty) returns (AdvancedActionResponse);
  
  rpc PurgeEjectedAndErrored(Empty) returns (AdvancedActionResponse);
  rpc ResetDuplicates(Empty) returns (AdvancedActionResponse);
  
  rpc PauseProcessing(Empty) returns (AdvancedActionResponse);
  rpc ResumeProcessing(Empty) returns (AdvancedActionResponse);
  
  rpc StartDatabaseIntegrityCheck(Empty) returns (AdvancedActionResponse);
  rpc GetDatabaseIntegrityCheckStatus(Empty) returns (IntegrityCheckStatusResponse);
  
  
  rpc ClearAllCaches(Empty) returns (ClearCachesResponse);
  
  rpc ConfigurePurityOrder(ConfigurePurityOrderRequest) returns (AdvancedActionResponse);
  
  rpc GetUserTheme(Empty) returns (GetUserThemeResponse);
  rpc SetUserTheme(SetUserThemeRequest) returns (AdvancedActionResponse);
}

message Empty {}

message AdvancedActionResponse {
  bool success = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  string error_message = 4;
}

message IntegrityCheckStatusResponse {
  bool running = 1;
  int32 progress = 2;
  int32 total_files = 3;
  int32 processed_files = 4;
  int32 files_removed = 5;
  int32 groups_removed = 6;
  int32 thumbnails_removed = 7;
  int32 artifacts_removed = 8;
  int32 errors_removed = 9;
  string current_phase = 10;
}

message ClearCachesResponse {
  bool success = 1;
  bool thumbnail_cache_cleared = 2;
  bool disk_cache_cleared = 3;
  string error_message = 4;
}

message ConfigurePurityOrderRequest {
  string purity_order = 1;
}

message GetUserThemeResponse {
  string theme = 1;
}

message SetUserThemeRequest {
  string theme = 1;
}

// ---------------------------------------------------------
// Media Service
// ---------------------------------------------------------
service MediaService {
  rpc GetThumbnail(GetMediaRequest) returns (MediaPathResponse);
  rpc GetPreview(GetMediaRequest) returns (MediaPathResponse);
  rpc CancelMediaGeneration(CancelMediaRequest) returns (Empty);
  // Pushes an event whenever an async thumbnail/preview generation finishes
  // (success or failure), so clients don't have to poll GetThumbnail/GetPreview
  // on a guessed schedule after an UNAVAILABLE "generating" answer.
  rpc SubscribeToMediaReady(Empty) returns (stream MediaReadyEvent);
}

message GetMediaRequest {
  string file_path = 1;
  string size = 2;
}

message CancelMediaRequest {
  string file_path = 1;
  string type = 2;
}

message MediaPathResponse {
  string file_path = 1;
  // True when the returned path is already full resolution (the original
  // file, or a cached full-res render) — the viewer can skip its zoom-time
  // full-resolution upgrade.
  bool is_full_resolution = 2;
}

message MediaReadyEvent {
  string file_path = 1;
  string media_type = 2; // "thumbnail" | "preview"
  bool success = 3;
  string error_message = 4; // set when success == false
}
